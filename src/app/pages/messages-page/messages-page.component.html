<div class="page">

  <!-- Header similar (solo lo esencial de Messages) -->
  <div class="topbar">
    <div class="crumbs">Inicio / <span>Messages</span></div>
    <div class="top-actions">
      <input class="search" placeholder="Search" />
      <button class="icon-btn" aria-label="theme">☼</button>
      <button class="icon-btn" aria-label="notif">🔔</button>
    </div>
  </div>

  <div class="content">

    <!-- Panel izquierdo: conversaciones -->
    <section class="left" [class.hidden-mobile]="!!selected">
      <app-conversation-list
        [items]="conversations"
        [selectedId]="selected?.id ?? null"
        (select)="selectConversation($event)">
      </app-conversation-list>
    </section>

    <!-- Panel derecho: chat -->
    <section class="right" [class.hidden-mobile]="!selected">
      <app-chat-thread
        [conversation]="selected"
        [messages]="messages"
        [loading]="loading"
        (send)="onSend($event)"
        (backMobile)="backToListMobile()">
      </app-chat-thread>
    </section>

  </div>
</div>
