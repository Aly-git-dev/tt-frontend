<div class="vm-container">
  <div class="vm-header">
    <div class="vm-title">
      <span class="vm-dot"></span>
      Videoconferencia
    </div>

    <div class="vm-actions">
      <button class="vm-btn vm-btn-danger" (click)="goBack()">
        Volver
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="vm-state">
    <div class="spinner"></div>
    <p>Abriendo videoconferencia...</p>
  </div>

  <div *ngIf="error && !loading" class="vm-state vm-error">
    <h3>⚠️ Error</h3>
    <p>{{ error }}</p>
    <button class="vm-btn" (click)="goBack()">
      Volver a agenda
    </button>
  </div>
</div>
