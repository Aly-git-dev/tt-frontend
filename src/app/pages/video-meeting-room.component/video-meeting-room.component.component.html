<div class="vm-container">

  <!-- HEADER -->
  <div class="vm-header">
    <div class="vm-title">
      <span class="vm-dot"></span>
      Videoconferencia
    </div>

    <div class="vm-actions">
      <button class="vm-btn vm-btn-danger" (click)="safeLeaveMeeting()">
        Salir
      </button>
    </div>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="vm-state">
    <div class="spinner"></div>
    <p>Cargando videoconferencia...</p>
  </div>

  <!-- ERROR -->
  <div *ngIf="error && !loading" class="vm-state vm-error">
    <h3>⚠️ Error</h3>
    <p>{{ error }}</p>
    <button class="vm-btn" routerLink="/agenda">
      Volver a agenda
    </button>
  </div>

  <!-- JITSI -->
  <div
    #jitsiContainer
    *ngIf="!loading && !error"
    class="vm-jitsi-container">
  </div>

</div>
