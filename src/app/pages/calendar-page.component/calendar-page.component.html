<div class="page">
  <!-- Title + breadcrumb -->
  <div class="page-head">
    <h1 class="page-title">Calendar</h1>
    <div class="breadcrumb">
      <span>Inicio</span>
      <span class="sep">/</span>
      <span class="current">Calendar</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="left-controls">
      <mat-chip-listbox class="chipset" aria-label="Filtro">
        <mat-chip-option
          [selected]="filter() === 'ALL'"
          (click)="filter.set('ALL')"
        >
          Todos
        </mat-chip-option>

        <mat-chip-option
          [selected]="filter() === 'CANCELLED'"
          (click)="filter.set('CANCELLED')"
        >
          Cancelados
        </mat-chip-option>
      </mat-chip-listbox>
    </div>

    <div class="right-controls">
      <div class="month-pager" aria-label="Navegacion de meses">
        <button mat-stroked-button type="button" class="pager-btn" (click)="previousMonth()">
          <mat-icon>chevron_left</mat-icon>
          Anterior
        </button>

        <button mat-stroked-button type="button" class="pager-btn today-btn" (click)="goToToday()">
          Hoy
        </button>

        <button mat-stroked-button type="button" class="pager-btn" (click)="nextMonth()">
          Siguiente
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>

      <button mat-flat-button class="primary-btn" (click)="openCreate()">
        <mat-icon>add</mat-icon>
        Nuevo
      </button>
    </div>
  </div>

  <!-- Calendar card -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">{{ monthLabel() }}</div>

      <div class="card-actions">
        <span class="hint" *ngIf="loading()">Cargando…</span>
      </div>
    </div>

    <div class="calendar-wrap">
      <full-calendar [options]="calendarOptions()"></full-calendar>
    </div>
  </section>
</div>
