<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a1233;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c21b50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo background -->
  <rect width="120" height="40" rx="8" fill="url(#logoGradient)"/>

  <!-- Text "CoLaB" -->
  <text x="60" y="26" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">CoLaB</text>

  <!-- Decorative elements -->
  <circle cx="20" cy="20" r="3" fill="white" opacity="0.8"/>
  <circle cx="100" cy="20" r="3" fill="white" opacity="0.8"/>
  <rect x="15" y="15" width="4" height="4" rx="1" fill="white" opacity="0.6"/>
  <rect x="101" y="15" width="4" height="4" rx="1" fill="white" opacity="0.6"/>
</svg>