<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- UPIIZ Logo - IPN Institucional -->
  <defs>
    <linearGradient id="upiizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5aa0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#upiizGrad)"/>
  
  <!-- UPIIZ text -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="white">UPIIZ</text>
  
  <!-- IPN text -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="8" 
        text-anchor="middle" fill="white" opacity="0.9">IPN</text>
  
  <!-- Decorative line -->
  <line x1="30" y1="67" x2="70" y2="67" stroke="white" stroke-width="1.5" opacity="0.6"/>
</svg>
